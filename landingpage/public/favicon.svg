<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <!--
    The GiwaCard mark: four notched quadrants, the same paths the nav and footer
    render. Drawn on a solid ink tile because a bare white mark disappears
    against light browser chrome, and at 16px there is no room to recover it.
  -->
  <rect width="320" height="320" rx="72" fill="#18161B"/>
  <g transform="translate(32,32)" fill="#F4F0ED">
    <path d="M 128 192 L 128 256 L 64.5 256 L 32 223 L 0 192 L 0 128 L 64 128 Z"/>
    <path d="M 256 192 L 256 256 L 192.5 256 L 160 223 L 128 192 L 128 128 L 192 128 Z"/>
    <path d="M 128 64 L 128 128 L 64.5 128 L 32 95 L 0 64 L 0 0 L 64 0 Z"/>
    <path d="M 256 64 L 256 128 L 192.5 128 L 160 95 L 128 64 L 128 0 L 192 0 Z"/>
  </g>
</svg>
