[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"

# Required by openzeppelin-foundry-upgrades (Upgrades.* storage-layout validation)
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]

[rpc_endpoints]
giwa_sepolia = "${GIWA_SEPOLIA_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
